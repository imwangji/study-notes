<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}img{max-width:100%}</style>
<title>学习笔记本</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* layout: a single reading column; one notebook-grid header, then a dated list of notes, newest first */
:root {
  --bg: #f5f7f8; --card: #ffffff; --text: #18242b; --muted: #5d6b74; --line: #c5cfd5; --grid: #e3e9ec; --accent: #17698a; --chip: #e9eef1;
  --display: 'Noto Serif SC', 'Songti SC', 'Noto Serif CJK SC', serif;
  --body: -apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
  --mono: 'JetBrains Mono', Consolas, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #11181c; --card: #182227; --text: #e4eaed; --muted: #93a2ab; --line: #3d4a52; --grid: #1a252b; --accent: #6cc0e0; --chip: #1e2a30; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #11181c; --card: #182227; --text: #e4eaed; --muted: #93a2ab; --line: #3d4a52; --grid: #1a252b; --accent: #6cc0e0; --chip: #1e2a30; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font: 17px/1.7 var(--body); }
.wrap { max-width: 780px; margin: 0 auto; padding-block: 0 72px; padding-inline: 16px; }
header { padding-block: 44px 30px; margin-inline: -16px; padding-inline: 16px; border-bottom: 1px solid var(--line);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
h1 { font: 700 38px/1.25 var(--display); margin: 0 0 8px; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 34em; }
.count { font: 13px var(--mono); color: var(--muted); letter-spacing: .08em; margin: 30px 0 4px; }
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
li { border-bottom: 1px solid var(--line); }
a.note { display: grid; grid-template-columns: 7.2em minmax(0, 1fr); gap: 4px 20px; padding-block: 22px; color: inherit; text-decoration: none; }
a.note:hover h2 { color: var(--accent); text-decoration: underline; text-underline-offset: 4px; }
a.note:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
time { font: 14px/2.1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
h2 { font: 600 22px/1.4 var(--display); margin: 0; text-wrap: balance; }
.sum { margin: 6px 0 10px; color: var(--muted); font-size: 16px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted); }
.meta span { background: var(--chip); border-radius: 4px; padding: 1px 8px; }
@media (max-width: 520px) { a.note { grid-template-columns: minmax(0, 1fr); } h1 { font-size: 30px; } time { line-height: 1.4; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>学习笔记本</h1>
    <p>从学习视频整理出来的图文笔记，按日期排列。每篇都带原视频的手写截图和对内容的更正。</p>
  </header>
  <div class="count" id="count"></div>
  <ul id="list"></ul>
</div>

<script>
// 每新增一篇笔记，在最前面加一项
const NOTES = [
  { date: '2026-10-11', href: 'notes/2026-10-11-network-to-sgd.html',
    title: '从 Network 到 SGD：两次学习录屏完整笔记',
    summary: '贯通网络初始化、矩阵乘法、前向传播、训练数据与小批次梯度更新，附视频截图、误解更正与两次实跑记录。',
    tags: ['神经网络', '两段视频 / 116 分钟', 'Python / NumPy', 'SGD', '实跑记录'] },

  { date: '2026-10-07', href: 'notes/2026-10-07-network-class.html',
    title: '读懂 Nielsen 的 Network 类',
    summary: '初始化时偏置和权重的形状从哪来，sigmoid 为什么只有一个参数，feedforward 的循环里 a 是怎么变的。',
    tags: ['神经网络', 'Python / NumPy', '视频 55 分钟', '10 张手写截图'] },
];
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
document.getElementById('count').textContent = '共 ' + NOTES.length + ' 篇';
document.getElementById('list').innerHTML = NOTES.map(n =>
  `<li><a class="note" href="${n.href}"><time datetime="${n.date}">${n.date}</time><div><h2>${esc(n.title)}</h2><p class="sum">${esc(n.summary)}</p><div class="meta">${n.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div></div></a></li>`).join('');
</script>

</body>
</html>
